name: CI

on:
  push:
    branches: [main, master, 'cursor/**']
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compile & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck / compile
        run: npm run compile

      - name: Unit tests
        run: npm run test:unit

      - name: MCP / fixture smoke
        run: npm run test:mcp-smoke

      - name: Package VSIX (dry)
        run: npm run package
