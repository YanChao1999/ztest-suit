name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: 'Also publish to VS Code Marketplace (requires VSCE_PAT secret)'
        type: boolean
        default: false
      publish_openvsx:
        description: 'Also publish to Open VSX (requires OVSX_PAT secret)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    name: Test before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run test:unit
      - run: npm run test:mcp-smoke

  publish:
    name: Package & publish
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run compile
      - run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ztest-suit-vsix
          path: '*.vsix'
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo "VSCE_PAT not set — skipping Marketplace publish (VSIX is still on the Release/artifact)."
            exit 0
          fi
          npx @vscode/vsce publish --packagePath ./*.vsix -p "$VSCE_PAT"

      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_openvsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT}" ]; then
            echo "OVSX_PAT not set — skipping Open VSX publish."
            exit 0
          fi
          npx ovsx publish ./*.vsix -p "$OVSX_PAT"
